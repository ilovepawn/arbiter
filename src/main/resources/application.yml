spring:
  application:
    name: arbiter
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true

arbiter:
  jwt:
    issuer: arbiter
    secret: ${JWT_SECRET}
    access-token-expiry: PT30M
    refresh-token-expiry: P14D
